<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten AI Sederhana Agus Saputra</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      height: 70vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #0284c7;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: #334155;
      border-bottom-left-radius: 4px;
    }

    .bot.error {
      background: #7f1d1d;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }

    #prompt {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }

    #prompt:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #0284c7;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      align-self: flex-start;
      color: #94a3b8;
      font-style: italic;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🤖 Asisten AI</h1>
  <p class="subtitle">Powered by DeepSeek via GrenTzy = AGUS SAPUTRA</p>

  <div class="chat-container">
    <div id="chat">
      <div class="msg bot">Halo! Ada yang bisa saya bantu?</div>
    </div>

    <div class="input-area">
      <input type="text" id="prompt" placeholder="Ketik pesanmu..." autocomplete="off">
      <button id="sendBtn" onclick="kirim()">Kirim</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    });

    async function kirim() {
      const text = promptInput.value.trim();
      if (!text) return;

      // Tampilkan pesan user
      tambahPesan(text, 'user');
      promptInput.value = '';
      sendBtn.disabled = true;

      // Loading indicator
      const loading = document.createElement('div');
      loading.className = 'loading';
      loading.textContent = 'Sedang berpikir...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const url = `https://api-faa.my.id/faa/deep-ai?text=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();

        loading.remove();

        if (data.status && data.result) {
          tambahPesan(data.result, 'bot');
        } else {
          tambahPesan('Maaf, terjadi kesalahan. Coba lagi.', 'bot error');
        }
      } catch (err) {
        loading.remove();
        tambahPesan('Gagal terhubung ke API. Periksa koneksi internet.', 'bot error');
        console.error(err);
      }

      sendBtn.disabled = false;
      promptInput.focus();
    }

    function tambahPesan(teks, tipe) {
      const div = document.createElement('div');
      div.className = `msg ${tipe}`;
      div.textContent = teks;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
